# betterframe-xp live parameters (re-read every 0.25 s while SteamVR runs)
# enabled: 1 = effects on, 0 = pass-through
enabled = 1

# --- Sharpen (AMD CAS) ---
# sharpenAmount 0..2: how much blurry edges are sharpened. 0 = off. Too high gives white/black fringes
sharpenAmount = 1.2
# sharpness 0..1: how aggressive the sharpening is (higher = stronger, also more noise)
sharpness = 0.7

# --- Deband (smooth colour steps in dark areas and skies) ---
# debandAmount 0..1: 0 = off
debandAmount = 0.0
# debandRange 1..32: how far (px) it looks for neighbours to blend with. Larger = wider smoothing
debandRange = 12
# debandThreshold 0.5..8: only colour differences below this (8-bit steps) are smoothed. Larger = more areas
debandThreshold = 2.5

# --- Foveated weighting (strong in the middle of each eye, weaker at the rim) ---
# centerRadius 0..1: inside this radius (fraction of the eye radius) effects run at full strength
centerRadius = 0.55
# edgeAmount 0..1: strength at the rim of each eye. 0 = no effect there, 1 = same as the center
edgeAmount = 0.4

# --- Detail-aware sharpen ---
# detailBoost 0..1: 0 = plain CAS. 1 = sharpen faint texture (grass, ground) up to 2x,
# flat areas and strong edges down to 0.25x
detailBoost = 0.0

# --- Luma grain (hides the smeared look of compressed texture) ---
# grainAmount 0..1: 0 = off
grainAmount = 0.0
# grainSize 1..4: grain cell size in px. 1 = finest
grainSize = 1
# grainAnimate: 1 = new pattern every frame, 0 = fixed pattern
grainAnimate = 1

# --- Sharpen method (lighter versions; ON = the lighter one. All 0 = the original CAS) ---
# casCross: 1 = read the cross only (5 taps). 0 = the 3x3 block (9 taps)
casCross = 1
# casLuma: 1 = sharpen luma only (one weight for all channels). 0 = each colour channel
casLuma = 1
# cornerSkip: corners of each eye beyond this radius (fraction of the eye radius) are not processed.
# 0 = off. 1.15 = the inscribed circle
cornerSkip = 1.15

# --- Where to use it ---
# streamOnly: 1 = effects run only on frames where the compositor draws the PC video (the Steam Link stream).
# Frames with no PC video (Frame home, dashboard, loading) are left alone. The UI drawn on top of the
# video in those frames is still processed. 0 = every frame (also Frame on its own, without the PC), but the
# author reports that the picture gets distorted when the dashboard is selected in that state
streamOnly = 1

# --- Colour grade (applied last, after sharpen / deband / grain. 1 = unchanged) ---
# contrast 0.5..1.5: contrast around mid grey
contrast = 1.0
# saturation 0..2: colour intensity (0 = greyscale, 1 = unchanged)
saturation = 1.0
# gamma 0.5..2.5: mid-tone curve (above 1 lifts the shadows)
gamma = 1.0
# temperature 0.8..1.2: warm/cool balance (above 1 warmer). Normalised by luma, so the overall brightness stays
temperature = 1.0
# brightness 0.5..1.5: overall brightness
brightness = 1.0

# --- Compare ---
# showSplit: 1 = only the right half of each eye is processed (A/B compare),
# with a white divider line (black borders) down the middle of each eye
showSplit = 0

# --- Panel ---
# uiLanguage: language of the dashboard panel. 0 = Japanese, 1 = English, 2 = Chinese.
# Only the panel reads this (switch it with the buttons at the top right of the panel); the layer ignores it
uiLanguage = 0
